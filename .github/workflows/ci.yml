name: CI
on:
  push: { branches: [main] }
  pull_request:

# Deploys are handled by Vercel's Git integration (site and API are separate
# Vercel projects with root directories site/ and api/). This workflow only tests.
jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
