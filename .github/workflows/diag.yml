name: diag
on: { push: { branches: [diag-share-card] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tickets page
        run: |
          {
          for u in /tickets /js/tickets-page.js /assets/og/tickets.jpg; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://moon369.org$u)"; done
          curl -s https://moon369.org/tickets | grep -o "<title>[^<]*" ; curl -s https://moon369.org/ | grep -c 'href="/tickets"'
          } > result.txt 2>&1
          git config user.name Moon && git config user.email moon369org@proton.me
          git add result.txt && git commit -m "diag result" && git push origin HEAD:diag-share-card
