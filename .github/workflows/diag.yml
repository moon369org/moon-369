name: diag
on: { push: { branches: [diag-share-card] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the live loader files
        run: |
          {
          for u in /assets/moon-loader.svg /assets/moon-loader-black.svg /assets/brand/loader/moon-loader.svg; do
            echo "=== $u"; curl -s -D /tmp/h "https://moon369.org$u" -o /tmp/b; grep -i "etag\|age\|cache" /tmp/h; grep -o "animation-duration:[^;}]*" /tmp/b
          done
          echo "=== index loader styles"; curl -s https://moon369.org/ | grep -o "mw-a,.mw-b,.mw-fill{animation-duration:[^;]*" | head -2
          } > result.txt 2>&1
          git config user.name Moon && git config user.email moon369org@proton.me
          git add result.txt && git commit -m "diag result" && git push origin HEAD:diag-share-card
