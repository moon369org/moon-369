name: diag
on: { push: { branches: [diag-share-card] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch as X and as a browser
        run: |
          {
          for ua in "Twitterbot/1.0" "facebookexternalhit/1.1" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"; do
            for u in "https://moon369.org/" "https://moon369.org" "https://moon369.org/assets/og/home.jpg?v=3" "https://moon369.org/tideline"; do
              echo "=== $ua | $u"
              curl -s -o /tmp/body -D - -A "$ua" "$u" | head -20
              echo "--- bytes: $(wc -c < /tmp/body)"
              grep -o '<meta[^>]*\(og:image\|twitter:card\|twitter:image\)[^>]*>' /tmp/body | head -3 || true
            done
          done
          } > result.txt 2>&1
          git config user.name Moon && git config user.email moon369org@proton.me
          git add result.txt && git commit -m "diag result" && git push origin HEAD:diag-share-card
