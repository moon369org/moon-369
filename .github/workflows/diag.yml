name: diag
on: { push: { branches: [diag-share-card] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check passes live
        run: |
          {
          curl -s -X POST https://api.moon369.org/v1/passes -H 'content-type: application/json' -d '{"name":"Live check gym"}' > /tmp/c; head -c 160 /tmp/c; echo
          P=$(python3 -c "import json;print(json.load(open('/tmp/c'))['place']['id'])"); K=$(python3 -c "import json;print(json.load(open('/tmp/c'))['key'])")
          echo "=== invite"; curl -s -X POST https://api.moon369.org/v1/passes/$P/invite -H 'content-type: application/json' -d "{\"key\":\"$K\",\"name\":\"Test\"}" | grep -o '"link": "[^"]*' | cut -c1-60
          echo "=== members"; curl -s -X POST https://api.moon369.org/v1/passes/$P/members -H 'content-type: application/json' -d "{\"key\":\"$K\"}" | grep -c invites
          for u in /passes /pass /members /js/pass.js /js/members.js /js/passes-page.js /assets/og/passes.jpg; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://moon369.org$u)"; done
          curl -s https://moon369.org/api | grep -c 'id="passes"'
          } > result.txt 2>&1
          git config user.name Moon && git config user.email moon369org@proton.me
          git add result.txt && git commit -m "diag result" && git push origin HEAD:diag-share-card
