name: diag
on: { push: { branches: [diag-share-card] } }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tickets live
        run: |
          {
          echo "=== create"; curl -s -X POST https://api.moon369.org/v1/tickets -H 'content-type: application/json' -d '{"name":"Live check"}' | tee /tmp/c | head -c 400; echo
          E=$(python3 -c "import json;print(json.load(open('/tmp/c'))['event']['id'])")
          echo "=== get"; curl -s https://api.moon369.org/v1/tickets/$E | head -c 300; echo
          echo "=== pages"; for u in /ticket /door /js/ticket.js /js/door.js /js/jsqr.js; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://moon369.org$u)"; done
          echo "=== api docs"; curl -s https://moon369.org/api | grep -c 'id="tickets"'
          } > result.txt 2>&1
          git config user.name Moon && git config user.email moon369org@proton.me
          git add result.txt && git commit -m "diag result" && git push origin HEAD:diag-share-card
