<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Moon time and the live moon in your pocket. Mark any moment with one tap and send a link that opens in everyone's own time.">
<link rel="canonical" href="https://moon369.org/app">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moon">
<meta property="og:url" content="https://moon369.org/app">
<meta property="og:title" content="Moon · the app">
<meta property="og:description" content="Moon time and the live moon in your pocket. Mark any moment with one tap.">
<meta property="og:image" content="https://moon369.org/assets/og/home.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/app.webmanifest">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moon">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-x:clip;background:#0B0B0D;color:#E9E4D8;font-family:'JetBrains Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
::selection{background:#24262A}
a{color:#E9E4D8}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}
.top svg{width:96px;height:auto;display:block}
.top a{font:11px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#8A8B8F;text-decoration:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 22px calc(96px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto}
.stage{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:8px 0 18px}
.stage canvas{position:absolute;left:-45%;top:-45%;width:190%;height:190%;pointer-events:none}
.k{font:11px 'JetBrains Mono',monospace;letter-spacing:.26em;color:#8A8B8F;text-align:center}
.date{margin-top:8px;font:700 clamp(26px,8vw,38px)/1.1 Syncopate,sans-serif;letter-spacing:.06em;text-align:center}
.clock{margin-top:8px;font:400 clamp(30px,10vw,46px)/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;text-align:center}
.clock span{color:#8A8B8F;font-size:.42em;letter-spacing:.04em}
.meta{margin-top:12px;font-size:14px;color:#A2A3A7;text-align:center;line-height:1.6}
.lt1{display:block;font-size:min(12px,2.8vw);white-space:nowrap;color:#8A8B8F}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:1px solid #E9E4D8;background:none;color:#E9E4D8;font:700 12px Syncopate,sans-serif;letter-spacing:.2em;cursor:pointer;text-decoration:none;border-radius:0}
.btn[hidden]{display:none}.btn.p{background:#E9E4D8;color:#0B0B0D}
.acts{display:grid;gap:10px;width:100%;margin-top:26px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row .btn{min-height:48px;font-size:10px;letter-spacing:.16em}
.recent{width:100%;margin-top:28px}
.recent a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #1C1D20;text-decoration:none;font-size:14px}
.recent a span:last-child{font:12px 'JetBrains Mono',monospace;color:#8A8B8F;white-space:nowrap}
.install{margin-top:22px;font-size:13px;color:#8A8B8F;text-align:center}
.install button{background:none;border:0;color:#E9E4D8;text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(5,5,6,.82);display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:520px;background:#0E0E11;border-top:1px solid #24262A;padding:24px 22px calc(24px + env(safe-area-inset-bottom));display:grid;gap:12px}
.panel{max-height:92vh;overflow:auto}.panel h2{margin:0;font:700 15px Syncopate,sans-serif;letter-spacing:.14em}
.panel .mk{font:18px 'JetBrains Mono',monospace}
.panel .lt{font-size:13px;color:#8A8B8F;margin-top:-6px}
.panel input{width:100%;min-height:52px;background:#08080A;border:1px solid #24262A;color:#E9E4D8;font:16px 'JetBrains Mono',monospace;padding:0 14px;border-radius:0}
.panel input:focus{outline:none;border-color:#8A8B8F}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel .x{background:none;border:0;color:#8A8B8F;font:12px 'JetBrains Mono',monospace;letter-spacing:.2em;cursor:pointer;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));max-width:86vw;text-align:center;transform:translateX(-50%);background:#E9E4D8;color:#0B0B0D;font:12px 'JetBrains Mono',monospace;padding:10px 16px;z-index:10}
.toast[hidden]{display:none}
.foot{padding:16px 22px 22px;text-align:center;font:11px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#5E6064}
.foot a{color:#8A8B8F;text-decoration:none}
.scr[hidden]{display:none}.scr{width:100%;display:flex;flex-direction:column;align-items:center}
.stage.sm{width:min(44vw,170px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;background:#0B0B0D;border-top:1px solid #1C1D20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:#8A8B8F;font:11px 'JetBrains Mono',monospace;letter-spacing:.22em;min-height:56px;cursor:pointer}
.tabs button{position:relative}.tabs button[aria-current="page"]{color:#E9E4D8}
.tabs button[aria-current="page"]::after{content:'';position:absolute;left:50%;bottom:9px;width:18px;height:2px;background:#E9E4D8;transform:translateX(-50%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 12px;width:100%}
.chips.g{display:grid;grid-template-columns:1fr 1fr}.chips.g button:last-child:nth-child(odd){grid-column:1/-1}.chips button{min-height:44px}
.chips button{background:none;border:1px solid #24262A;color:#B9B6AE;font:10.5px 'JetBrains Mono',monospace;letter-spacing:.16em;padding:10px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:#E9E4D8;background:#E9E4D8;color:#0B0B0D}
input.f,.two.f input{width:100%;min-height:52px;background:#08080A;border:1px solid #24262A;color:#E9E4D8;font:16px 'JetBrains Mono',monospace;padding:0 14px;border-radius:0;margin-bottom:10px;color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.two .btn{min-height:48px;font-size:10.5px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.three .btn{min-height:48px;font-size:10.5px;letter-spacing:.16em}
.nres[hidden]{display:none}.nres{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:1px solid #24262A;border-bottom:1px solid #24262A;margin:6px 0}
.cells div{padding:12px 0;text-align:center}.cells div+div{border-left:1px solid #24262A}.cells span{display:block;font:10px 'JetBrains Mono',monospace;letter-spacing:.22em;color:#8A8B8F}.cells b{display:block;margin-top:6px;font:700 20px Syncopate,sans-serif}
.dim{color:#8A8B8F!important;font-size:13px!important}
.qr[hidden]{display:none}.qr svg{width:220px;height:220px;display:block;margin:4px auto}
.clock small{color:#8A8B8F;font-size:.42em}
.recent a small{color:#8A8B8F}
.step[hidden]{display:none}.step{display:grid;gap:12px}
.ok{display:flex;align-items:center;gap:12px}.ok span{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#4CC38A;color:#0B0B0D;font:700 16px 'JetBrains Mono',monospace}.ok b{font:700 14px Syncopate,sans-serif;letter-spacing:.14em}
.rn{font-size:18px;font-weight:500}.rn:empty{display:none}
.lk{font:12px 'JetBrains Mono',monospace!important;color:#B9B6AE!important;min-height:44px!important}
.qr svg{width:170px;height:170px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fl{font:10px 'JetBrains Mono',monospace;letter-spacing:.22em;color:#8A8B8F}
.fw{position:relative;display:block;min-width:0}
.two.f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* iOS draws date and time fields at their own size; make them plain boxes that fill the column. */
.fw input{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;height:52px;min-height:52px;margin:0;padding:0 14px;line-height:52px;text-align:left}
.fw input::-webkit-date-and-time-value{text-align:left;margin:0;min-height:52px;line-height:52px}
.fw input::-webkit-datetime-edit{padding:0;line-height:52px}
.fw input::-webkit-calendar-picker-indicator{filter:invert(.85);opacity:.7}
.fw .ph{position:absolute;left:14px;top:26px;transform:translateY(-50%);pointer-events:none;color:#5E6064;font-size:15px;white-space:nowrap}
.fw input.empty::-webkit-datetime-edit{color:transparent}
.fw input.empty:focus::-webkit-datetime-edit{color:inherit}
.fw input:not(.empty)+.ph,.fw input:focus+.ph{display:none}
.nphase{font:500 17px 'JetBrains Mono',monospace;color:#E9E4D8;text-align:center;margin-top:2px}
.nphase:empty{display:none}
.nres .date{margin-top:4px}
</style>
</head>
<body>
<div class="top">
  <a href="/" aria-label="Moon home"><svg viewBox="-10 -10 424 120" aria-hidden="true"><path d="M4,100 V4 L48,64 L92,4 V100" fill="none" stroke="#E9E4D8" stroke-width="8" stroke-linejoin="bevel"/><circle cx="172" cy="50" r="46" fill="none" stroke="#E9E4D8" stroke-width="8"/><circle cx="232" cy="50" r="46" fill="none" stroke="#0B0B0D" stroke-width="18"/><circle cx="232" cy="50" r="46" fill="none" stroke="#E9E4D8" stroke-width="8"/><path d="M211.91,72.87 A46,46 0 0 1 188.65,92.88" fill="none" stroke="#0B0B0D" stroke-width="18"/><path d="M211.91,72.87 A46,46 0 0 1 188.65,92.88" fill="none" stroke="#E9E4D8" stroke-width="8"/><path d="M312,100 V4 L400,96 V0" fill="none" stroke="#E9E4D8" stroke-width="8" stroke-linejoin="bevel"/></svg></a>
  <a href="/">MOON369.ORG →</a>
</div>
<main>
  <section class="scr" data-scr="now">
    <div class="stage"><canvas class="hm-moonglow" role="img" aria-label="The Moon right now" data-app-moon></canvas></div>
    <div class="k">MOON TIME · THE SAME EVERYWHERE</div>
    <div class="date" data-app-date>&nbsp;</div>
    <div class="clock" data-app-clock>&nbsp;</div>
    <div class="meta" data-app-meta>&nbsp;</div>
    <div class="acts">
      <button class="btn p" type="button" data-app-mark>MARK THIS MOMENT</button>
      <button class="btn" type="button" data-go="events">CREATE AN EVENT</button>
    </div>
    <div class="recent" data-app-recent hidden></div>
    <div class="install" data-app-install hidden></div>
  </section>
  <section class="scr" data-scr="nights" hidden>
    <div class="k" style="margin-top:6px">EXPLORE A NIGHT</div>
    <div class="chips g" data-n-chips><button type="button" data-for="born" aria-pressed="true">I WAS BORN</button><button type="button" data-for="met">WE MET</button><button type="button" data-for="wed">OUR WEDDING</button><button type="button" data-for="kid">MY CHILD WAS BORN</button><button type="button" data-for="day">ANY DAY</button></div>
    <div class="two f"><label class="fld"><span class="fl">DATE</span><span class="fw"><input type="date" class="empty" data-n-date><span class="ph">Mar 14, 1988</span></span></label><label class="fld"><span class="fl">TIME · OPTIONAL</span><span class="fw"><input type="time" class="empty" data-n-time><span class="ph">9:30 PM</span></span></label></div>
    <button class="btn p" type="button" data-n-show>SHOW ME THE MOON</button>
    <div class="nres" data-n-res hidden>
      <div class="stage sm"><canvas class="hm-moonglow" aria-hidden="true" data-n-moon></canvas></div>
      <div class="k" data-n-title></div>
      <div class="date" data-n-date-out></div>
      <div class="nphase" data-n-phase></div>
      <div class="meta dim" data-n-facts></div>
      <div class="cells" data-n-cells></div>
      <div class="meta dim" data-n-returns></div>
      <button class="btn p" type="button" data-n-share>SHARE THIS MOON</button>
      <div class="two"><button class="btn" type="button" data-n-card>SAVE CARD</button><a class="btn" data-n-open target="_blank" rel="noopener">FULL PAGE</a></div>
    </div>
    <div class="recent" data-n-saved hidden></div>
  </section>
  <section class="scr" data-scr="events" hidden>
    <div class="k" style="margin-top:6px">EVENTS · ONE LINK, EVERY TIME ZONE</div>
    <input type="text" maxlength="80" class="f" placeholder="Name the event" data-e-name aria-label="Event name">
    <input type="datetime-local" class="f" data-e-when aria-label="Date and time, in your time">
    <div class="chips" data-e-quick><button type="button" data-add="3600000">NOW + 1 HOUR</button><button type="button" data-add="86400000">+ 1 DAY</button><button type="button" data-add="604800000">+ 1 WEEK</button><button type="button" data-add="now">NOW</button></div>
    <div class="meta dim" data-e-note>Everyone who opens the link sees it in their own time.</div>
    <button class="btn p" type="button" data-e-make>MAKE THE LINK</button>
    <div class="recent" data-e-list hidden></div>
  </section>
</main>
<nav class="tabs" aria-label="App"><button type="button" data-tab="now" aria-current="page">NOW</button><button type="button" data-tab="nights">NIGHTS</button><button type="button" data-tab="events">EVENTS</button></nav>

<div class="sheet" data-app-sheet hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="step" data-step="name">
      <h2 id="sheet-h" data-sheet-h>SHARE THIS MOMENT</h2>
      <div class="mk" data-sheet-mk></div>
      <div class="lt" data-sheet-lt></div>
      <input type="text" maxlength="80" placeholder="What's happening? (optional)" data-sheet-name aria-label="Name this moment">
      <button class="btn p" type="button" data-sheet-create>MARK IT</button>
    </div>
    <div class="step" data-step="ready" hidden>
      <div class="ok"><span aria-hidden="true">✓</span><b data-ready-h>YOUR MOMENT IS READY</b></div>
      <div class="rn" data-ready-name></div>
      <div class="mk" data-ready-mk></div>
      <div class="lt" data-ready-lt></div>
      <div class="qr" data-sheet-qrbox></div>
      <input type="text" readonly class="lk" data-ready-link aria-label="Link">
      <button class="btn p" type="button" data-sheet-share>SHARE</button>
      <div class="two"><button class="btn" type="button" data-sheet-copy>COPY LINK</button><button class="btn" type="button" data-sheet-card>SAVE CARD</button></div>
      <a class="btn" target="_blank" rel="noopener" data-sheet-x href="https://x.com">POST TO X</a>
      <button class="x" type="button" data-sheet-embed hidden>COPY COUNTDOWN EMBED</button>
      <div class="lt" style="text-align:center">It works right away. Anyone who opens it sees it in their own time.</div>
    </div>
    <button class="x" type="button" data-sheet-close>DONE</button>
  </div>
</div>
<div class="toast" data-app-toast hidden role="status"></div>

<script src="/js/moon-phase.js" defer></script>
<script src="/js/moonglow.js" defer></script>
<script src="/js/qrcode.js" defer></script>
<script src="/js/moonqr.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
