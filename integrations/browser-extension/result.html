<!doctype html><html><head><meta charset="utf-8"><title>Signed on Moon</title><link rel="stylesheet" href="style.css">
<style>main{max-width:980px;margin:0 auto;padding:56px 32px}.card{display:grid;grid-template-columns:1fr 260px;gap:40px;border:1px solid #24262A;background:#08080A;padding:36px}
.ok{color:#4CC38A}.bad{color:#F0645C}.mark{margin-top:14px;font-size:clamp(24px,3.4vw,38px);word-break:break-all}.mark span{color:#8A8B8F;font-size:.6em}
.when{color:#A2A3A7;margin-top:6px}dl{margin:22px 0 0;display:grid;gap:10px}dl div{display:grid;grid-template-columns:120px 1fr;gap:12px}dt{font:11px "JetBrains Mono",monospace;letter-spacing:.2em;color:#8A8B8F;padding-top:3px}dd{margin:0;word-break:break-all;font-size:14px}
.link{display:flex;margin-top:22px}.link input{flex:1;min-width:0;border-right:0}.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.note{color:#8A8B8F;font-size:14px;margin:18px 0 0}
.qr svg{width:100%;height:auto;display:block}.qr .k{text-align:center;margin-top:10px}img.prev{max-width:100%;max-height:220px;margin-top:20px;border:1px solid #24262A}
@media (max-width:760px){.card{grid-template-columns:1fr}}</style></head>
<body><main id="out"><div class="k">SIGNING…</div></main>
<script src="moon-phase.js"></script><script src="qrcode.js"></script><script src="moonqr.js"></script><script src="result.js"></script></body></html>
