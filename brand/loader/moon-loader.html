<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Loader</title>
<style>
html,body{margin:0;height:100%;background:#0B0B0D}
body{display:flex;align-items:center;justify-content:center}
.moon-loader{width:min(40vw,360px);height:auto;display:block;overflow:visible}
.mn-a,.mn-b,.mn-fill{animation-duration:3.2s;animation-iteration-count:infinite;animation-fill-mode:both}
.mn-a{animation-name:mnA}.mn-b{animation-name:mnB}.mn-fill{animation-name:mnFill}
@keyframes mnA{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,0,.55,1)}48%,52%{transform:translateX(-30px);animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{transform:translateX(0)}}
@keyframes mnB{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,0,.55,1)}48%,52%{transform:translateX(30px);animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{transform:translateX(0)}}
@keyframes mnFill{0%{opacity:1;animation-timing-function:cubic-bezier(.4,0,.6,1)}36%,54%{opacity:0;animation-timing-function:cubic-bezier(.4,0,.6,1)}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.mn-a,.mn-b,.mn-fill{animation:none}}
</style>
</head>
<body>
<svg class="moon-loader" viewBox="-90 -70 180 140" role="img" aria-label="Loading">
<g class="mn-b"><circle cx="0" cy="0" r="46" fill="none" stroke="#E9E4D8" stroke-width="8"/></g>
<g class="mn-a"><circle class="mn-fill" cx="0" cy="0" r="50" fill="#E9E4D8"/><circle cx="0" cy="0" r="46" fill="none" stroke="#E9E4D8" stroke-width="8"/></g>
</svg>
</body>
</html>
