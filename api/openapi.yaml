openapi: 3.1.0
info:
  title: Moon API
  version: 1.2.0
  summary: The open standard for time. The worldwide timestamp, locked to the moon.
  license: { name: MIT, identifier: MIT }
  description: |
    All times are Moon time unless a field name says `utc` or `unix`.
    Nanosecond values are returned as strings to keep full precision.
    No key is required. Send `Authorization: Bearer <key>` for the higher keyed limit.
servers:
  - url: https://api.moon369.org
components:
  securitySchemes:
    key: { type: http, scheme: bearer }
  schemas:
    MoonTime:
      type: object
      properties:
        year: { type: integer, example: 1928 }
        moon: { type: integer, minimum: 1, maximum: 13, example: 5 }
        day: { type: integer, minimum: 1, maximum: 29, example: 3 }
        day_of_year: { type: integer, minimum: 1, maximum: 369 }
        moon_length_days: { type: integer, enum: [28, 29] }
        time: { type: string, example: "08:57:39" }
        moonmark: { type: string, example: "1928.05.03 08:57:39.035909351", description: "One exact moment, the same everywhere" }
        moonmark_url: { type: string, description: Link that opens this Moonmark. Put it in a QR code. }
        phase:
          type: object
          properties:
            fraction: { type: number, description: "0 = new moon, 0.5 = full moon" }
            name: { type: string, example: Waxing crescent }
        moon_ns: { type: string, description: Moon nanoseconds since the epoch }
        unix_ns: { type: string, example: "1794516299901000000" }
        unix_ms: { type: integer }
        utc: { type: string, example: "2026-11-12T20:44:59.901000000Z" }
        time_zone: { type: "null" }
        dst: { type: boolean, const: false }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [missing_param, bad_param, bad_json, too_large, out_of_range, not_found, rate_limited, invalid_key, keys_disabled, method_not_allowed, signing_unavailable, internal] }
            message: { type: string }
            contact: { type: string, description: Email for higher limits. Present on rate_limited. }
    Receipt:
      type: object
      description: 'A signed Moonmark. Signed bytes are receipt, "sha256:" + sha256, moonmark, unix_ns and key_id joined by newlines (UTF-8), signed with Ed25519.'
      required: [receipt, sha256, moonmark, unix_ns, key_id, signature]
      properties:
        receipt: { type: string, enum: [moonmark-receipt/1] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Fingerprint of the signed content }
        moonmark: { type: string, example: '1928.05.05 00:40:56.209029029' }
        unix_ns: { type: string, description: The same moment in Unix nanoseconds }
        key_id: { type: string, description: First 16 hex characters of SHA-256 of the raw public key }
        signature: { type: string, description: base64url Ed25519 signature }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: 'Rate limit reached. For higher limits email moon369org@proton.me.', headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security: [{}, { key: [] }]
paths:
  /v1/now:
    get:
      summary: Current Moon date and time
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MoonTime' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/moonmark:
    get:
      summary: A Moonmark, nanosecond precise, with clock accuracy. /v1/stamp is the old name and still works.
      parameters:
        - { name: unix_ns, in: query, schema: { type: string }, description: Instant to mark. Omit to mark the server receive time. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moonmark: { type: string }
                  moonmark_url: { type: string }
                  moon_ns: { type: string }
                  unix_ns: { type: string }
                  utc: { type: string }
                  accuracy_ns: { type: [integer, "null"], description: null when the caller supplied the instant }
                  clock: { type: string, example: server-ntp }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/convert:
    get:
      summary: Standard time to Moon time
      parameters:
        - { name: unix, in: query, schema: { type: integer }, description: Unix milliseconds }
        - { name: unix_ns, in: query, schema: { type: string }, description: Unix nanoseconds }
        - { name: utc, in: query, schema: { type: string }, description: ISO 8601 with Z or offset, up to 9 fraction digits }
        - { name: format, in: query, schema: { type: string, enum: [object, string] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MoonTime' } }, text/plain: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/m/{moonmark}:
    get:
      summary: Open a Moonmark link. The URL form is YEAR.MM.DD-HH.MM.SS.fraction, which is what a Moonmark QR code carries.
      parameters:
        - { name: moonmark, in: path, required: true, schema: { type: string, example: '1928.05.03-08.57.39.035909351' } }
      responses:
        '200': { description: The moment, content: { application/json: { schema: { $ref: '#/components/schemas/MoonTime' } } } }
  /v1/to-unix:
    get:
      summary: Moon time to standard time
      parameters:
        - { name: moonmark, in: query, schema: { type: string }, description: "A Moonmark, YEAR.MM.DD HH:MM:SS.fraction (alternative to the fields below). stamp is accepted as the old name." }
        - { name: year, in: query, schema: { type: integer } }
        - { name: moon, in: query, schema: { type: integer, minimum: 1, maximum: 13 } }
        - { name: day, in: query, schema: { type: integer, minimum: 1, maximum: 29 } }
        - { name: time, in: query, schema: { type: string, example: "12:30:00.5" } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unix_ns: { type: string }
                  unix_ms: { type: integer }
                  utc: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/year/{year}:
    get:
      summary: All 13 moons of a Moon year with UTC start instants
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/keys:
    get:
      summary: Moon's public signing keys, active and retired
      responses:
        '200': { description: 'Keys as base64url raw Ed25519 public keys, with key_id and status' }
  /v1/sign:
    post:
      summary: Sign a SHA-256 fingerprint at this moment and get a receipt
      description: Send only the fingerprint, never the content.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [sha256], properties: { sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' } } } } }
      responses:
        '200': { description: 'The receipt, its Moonmark link, utc, accuracy_ns and clock', content: { application/json: { schema: { type: object, properties: { receipt: { $ref: '#/components/schemas/Receipt' }, moonmark_url: { type: string }, utc: { type: string }, accuracy_ns: { type: integer }, clock: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Signing is not configured on this deployment }
  /v1/verify:
    post:
      summary: Check a receipt, and optionally that it matches your content
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [receipt], properties: { receipt: { $ref: '#/components/schemas/Receipt' }, sha256: { type: string } } } } }
      responses:
        '200': { description: 'valid true with moonmark, utc and key_id, or valid false with a reason: bad_signature, unknown_key, content_mismatch, moonmark_mismatch, malformed, unknown_version, not_a_receipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/spec:
    get:
      summary: The constants of the standard, including the exact Moon second ratio
      responses:
        '200': { description: OK }
