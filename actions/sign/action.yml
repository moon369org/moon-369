name: Sign files on Moon
description: 'Timestamp release files with signed Moonmarks (Ed25519 + ML-DSA-65). Only SHA-256 fingerprints leave the runner.'
author: Moon
branding:
  icon: moon
  color: gray-dark
inputs:
  files:
    description: 'Files or glob patterns to sign, one per line or space-separated (for example "dist/*" or "build/**/*.zip"). Optional when commit is "true".'
    required: false
    default: ''
  commit:
    description: 'Also sign the commit itself ("true" or "false"): the SHA-256 of its git object, which anyone with the repo can recompute.'
    required: false
    default: 'false'
  ref:
    description: 'Which commit to sign when commit is "true" (default HEAD). Needs the commit fetched (actions/checkout does).'
    required: false
    default: HEAD
  release-notes:
    description: 'Append a "Signed on Moon" table with a proof link per file to the release notes ("true" or "false"). Release events only; needs "permissions: contents: write".'
    required: false
    default: 'false'
  api-key:
    description: 'A Moon API key (store it as a secret). Without one, Moon signs up to 5 files a run. Free keys at https://moon369.org/api#key'
    required: false
    default: ''
  label:
    description: 'Optional label stored with each registration, before the file name (for example "v1.2.0").'
    required: false
    default: ''
  output:
    description: 'Where to write the receipts (JSON).'
    required: false
    default: moon-receipts.json
  upload-to-release:
    description: 'Attach the receipts file to the GitHub release that triggered the run ("true" or "false"). Needs "permissions: contents: write".'
    required: false
    default: 'false'
  api:
    description: 'Moon API base URL.'
    required: false
    default: https://api.moon369.org
outputs:
  receipts:
    description: 'Path of the receipts file.'
    value: ${{ steps.sign.outputs.receipts }}
  count:
    description: 'How many files (and commits) were signed.'
    value: ${{ steps.sign.outputs.count }}
  notes:
    description: 'Path of a Markdown table of every proof, ready for release notes or a PR comment.'
    value: ${{ steps.sign.outputs.notes }}
runs:
  using: composite
  steps:
    - id: sign
      shell: bash
      env:
        MOON_FILES: ${{ inputs.files }}
        MOON_KEY: ${{ inputs.api-key }}
        MOON_LABEL: ${{ inputs.label }}
        MOON_OUT: ${{ inputs.output }}
        MOON_API: ${{ inputs.api }}
        MOON_COMMIT: ${{ inputs.commit }}
        MOON_REF: ${{ inputs.ref }}
      run: bash "${{ github.action_path }}/sign.sh"
    - if: ${{ inputs.upload-to-release == 'true' && github.event_name == 'release' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.sign.outputs.receipts }}" --clobber --repo "${{ github.repository }}"
    - if: ${{ inputs.release-notes == 'true' && github.event_name == 'release' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
        NOTES: ${{ steps.sign.outputs.notes }}
      run: |
        body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body)
        printf '%s\n\n%s\n' "$body" "$(cat "$NOTES")" > "$RUNNER_TEMP/moon-notes.md"
        gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$RUNNER_TEMP/moon-notes.md"
